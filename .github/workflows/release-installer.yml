name: Build installers

# Publishing a release builds the Windows MSI and the macOS disk image and attaches both to that release.
# "Run workflow" on the Actions tab makes a test build of each, kept as workflow artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 10.0.7). Empty uses Directory.Build.props."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # a tag like v10.0.7 sets the version; any other tag keeps the one in Directory.Build.props
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Pick version
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-${TAG#[vV]}}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || v=""
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: ${v:-from Directory.Build.props}"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install WiX 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      # Native AOT: hosted runners have the Visual Studio C++ tools it needs
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./source/__assets/win/fateglass/build-fateglass.ps1 -Aot -NoSettingsSync -Version $env:VERSION

      - name: Keep installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FateGlass-win-x64
          path: source/__artifacts/bundle/*.msi
          if-no-files-found: error

      - name: Attach installer to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG (Get-ChildItem source/__artifacts/bundle/*.msi).FullName --clobber

  macos:
    needs: version
    # Apple silicon, with the Xcode tools Native AOT links with
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build disk image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash source/__assets/mac/fateglass/build-fateglass.sh --dmg ${VERSION:+--version "$VERSION"}

      - name: Keep disk image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FateGlass-osx-arm64
          path: source/__artifacts/bundle/*.dmg
          if-no-files-found: error

      - name: Attach disk image to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" source/__artifacts/bundle/*.dmg --clobber
